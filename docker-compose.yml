version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: intellmeet-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: intellmeet-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: intellmeet-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/intellmeet
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: intellmeet_prod_access_secret_998877
      JWT_REFRESH_SECRET: intellmeet_prod_refresh_secret_112233
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: intellmeet-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
